name: telehost_maps
description: Cliente Dart de TeleHost Maps — rutas, giro a giro en español, búsqueda de negocios y direcciones en América Latina, España y EE.UU. Alternativa a Google Maps Platform.
version: 0.2.0
repository: https://github.com/telehostca/maps-sdk
issue_tracker: https://github.com/telehostca/maps-sdk/issues
documentation: https://maps.telehost.net/dev/

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  # El widget MarcaTeleHost es un Widget: por eso el paquete pasa a depender
  # de Flutter. El cliente HTTP en si sigue siendo Dart puro.
  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
  flutter_test:
    sdk: flutter
